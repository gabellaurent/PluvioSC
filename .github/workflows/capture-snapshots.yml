name: Captura Horária de Imagens dos Rios 📸

on:
  schedule:
    - cron: '*/30 * * * *' # Executa a cada 30 minutos
  workflow_dispatch: # Permite execução manual no painel do GitHub

permissions:
  contents: write

jobs:
  capture-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Executar Captura de Snapshots
        run: node scripts/captureSnapshots.js

      - name: Salvar e Enviar Commit de Snapshots
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add public/snapshots/
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(cron): atualiza snapshots horários dos rios" && git push origin main)

      - name: Build da Aplicação
        run: npm run build

      - name: Deploy no GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
